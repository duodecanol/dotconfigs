- name: Setup Kubectl Dir
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.kube"
    state: directory
    owner: "{{ ansible_env.USER }}"
    # group: "{{ ansible_env.USER }}"
    mode: '0700'

- name: Copy Kubectl Config
  ansible.builtin.copy:
    src: "k3s.yaml"
    dest: "{{ ansible_env.HOME }}/.kube/k3s.yaml"
    owner: "{{ ansible_env.USER }}"
    # group: "{{ ansible_env.USER }}"
    mode: '0644'

- name: Tap a Homebrew repository, state present
  community.general.homebrew_tap:
    name: fluxcd/tap

- name: Install Brew Packages
  community.general.homebrew:
    name: "{{ item.name }}"
    state: "{{ item.state }}"
  become: false
  with_items:
    - { name: kubectl, state: present }
    - { name: age, state: present }
    - { name: sops, state: present }
    - { name: k9s, state: present }
    - { name: kubeseal, state: present }
    - { name: talosctl, state: present }
    - { name: talhelper, state: present }
    - { name: kubectl-cnpg, state: present }
    - { name: kubectl-ai, state: present }
    - { name: helm, state: present }
    - { name: fluxcd/tap/flux, state: present }

- name: Create Config Dir
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config"
    state: directory
    owner: "{{ ansible_env.USER }}"
    # group: "{{ ansible_env.USER }}"
    mode: '0700'

- name: Install Config Dir
  ansible.builtin.copy:
    src: "kubectl-ai"
    dest: "{{ ansible_env.HOME }}/.config/"
    owner: "{{ ansible_env.USER }}"
    # group: "{{ ansible_env.USER }}"
    mode: '0755'
