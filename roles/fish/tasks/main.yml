- name: Copy hidden config
  ansible.builtin.template:
    src: conf.d/bitwarden.fish.j2
    dest: "{{ ansible_env.HOME }}/.config/fish/conf.d/bitwarden.fish"
    owner: "{{ ansible_env.USER }}"
    group: "{{ ansible_env.USER }}"
    mode: '0644'
